openapi: 3.1.0
info:
  title: HRM API
  version: TBD (To Be Determined)
  description: >-
    Quy ước chung đã duyệt. Paths và DTO module còn TBD (To Be Determined);
    chỉ thêm sau khi Product Owner duyệt từng contract. JSON UTF-8;
    200 cho đọc/sửa, 201 cho tạo, 204 không có body cho xóa.
    URL thiếu version hoặc version chưa hỗ trợ trả 404 RESOURCE_NOT_FOUND.
    400 cho input sai, 401 cho xác thực, 403 cho thiếu quyền thao tác hoặc
    Manager xem nhân viên ngoài phòng ban, 404 cho tài nguyên khác ngoài phạm vi,
    409 cho xung đột, 429 cho rate limit,
    500 cho lỗi server. API có đăng nhập và response chứa token dùng Cache-Control no-store;
    timeout HTTP thông thường 30 giây. Endpoint công khai và ngoại lệ chờ contract module.
servers:
  - url: /api/v1
    description: Prefix phiên bản; host lấy từ môi trường triển khai.
x-hrm-conventions:
  mediaType: application/json; charset=utf-8
  accept: application/json
  date: DD/MM/YYYY
  timestamp: DD/MM/YYYY HH:mm:ss; Asia/Bangkok (UTC+7)
  requestId: Server tạo cho mọi request; trả trong meta.requestId và X-Request-Id.
  compatibility: Giữ field/status/ý nghĩa đã công bố trong v1; thay đổi phá vỡ contract phải sang /api/v2 sau khi duyệt.
  unknownInput: 400 VALIDATION_ERROR; nêu field query hoặc JSON ngoài contract.
  patch: Field vắng mặt giữ nguyên; null xóa giá trị nếu field cho phép.
  responseNull: Field thuộc schema nhưng chưa có giá trị trả null nếu schema cho phép.
  pagination:
    pageStartsAt: 1
    pageSizeDefault: 20
    pageSizeMaximum: 100
    invalidInput: 400 VALIDATION_ERROR; không tự sửa giá trị.
    beyondLastPage: 200 với data rỗng và tổng thực.
    emptyListTotalPages: 0
  sorting: sortBy=<field>&sortOrder=asc|desc; field cho phép do module xác định.
  filtering: Query parameter trực tiếp; field cho phép do module xác định.
  accessToken: JWT HS256; Bearer header; 15 phút.
  refreshToken: JWT HS256; HttpOnly cookie; 7 ngày; SameSite=Lax; Secure trên HTTPS.
  retry: Sau 429, client chỉ tự retry GET hoặc request có Idempotency-Key.
  idempotency: Header Idempotency-Key chỉ dùng cho POST được module chỉ rõ.
  idempotencyRetention: 24 giờ; cùng key/payload trả kết quả đã lưu; cùng key khác payload trả 409 RESOURCE_CONFLICT.
  authenticatedCache: Cache-Control no-store cho API cần đăng nhập và response chứa token.
  commonTimeout: 30 giây; operation đặc biệt do contract module quy định.
  concurrentEdit: Từ chối mọi lượt lưu dựa trên bản cũ; client yêu cầu tải lại trước khi sửa tiếp; vẫn kiểm tra quyền và trạng thái nghiệp vụ tại lúc lưu.
  rateLimit:
    common: 120 request/phút/IP
    login: 5 lần/15 phút/email+IP
    refresh: 30 request/phút/IP
  pending:
    - Endpoint và DTO từng module, gồm Auth.
    - Cache cho endpoint công khai, nếu có.
    - Operation dùng Idempotency-Key và timeout đặc biệt.
    - Cách truyền phiên bản bản ghi và HTTP status/error.code khi từ chối bản cũ.
paths: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    DateVN:
      type: string
      pattern: '^([0-2][0-9]|3[01])/(0[1-9]|1[0-2])/[0-9]{4}$'
      description: Ngày DD/MM/YYYY; ngày hợp lệ còn phải kiểm tra theo lịch.
      examples: ['21/10/2026']
    DateTimeVN:
      type: string
      pattern: '^([0-2][0-9]|3[01])/(0[1-9]|1[0-2])/[0-9]{4} ([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$'
      description: Thời điểm DD/MM/YYYY HH:mm:ss theo giờ Việt Nam UTC+7.
      examples: ['21/10/2026 15:30:00']
    Meta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId:
          type: string
          description: ID do server tạo cho mỗi request; trùng header X-Request-Id.
        timestamp:
          $ref: '#/components/schemas/DateTimeVN'
    SuccessResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          description: Schema cụ thể do contract module xác định.
        meta:
          $ref: '#/components/schemas/Meta'
    PageMeta:
      allOf:
        - $ref: '#/components/schemas/Meta'
        - type: object
          required: [page, pageSize, totalItems, totalPages]
          properties:
            page:
              type: integer
              minimum: 1
            pageSize:
              type: integer
              minimum: 1
              maximum: 100
            totalItems:
              type: integer
              minimum: 0
            totalPages:
              type: integer
              minimum: 0
    PageResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            description: Schema item do contract module xác định.
        meta:
          $ref: '#/components/schemas/PageMeta'
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
        message:
          type: string
    Error:
      type: object
      additionalProperties: false
      required: [code, message, details]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, meta]
      properties:
        error:
          $ref: '#/components/schemas/Error'
        meta:
          $ref: '#/components/schemas/Meta'
  parameters:
    Idempotency-Key:
      name: Idempotency-Key
      in: header
      description: Chỉ dùng cho POST được contract module chỉ rõ; lưu kết quả 24 giờ, cùng key/payload trả kết quả đã lưu, khác payload trả 409 RESOURCE_CONFLICT.
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SortBy:
      name: sortBy
      in: query
      schema:
        type: string
      description: Field cho phép do contract module xác định.
    SortOrder:
      name: sortOrder
      in: query
      schema:
        type: string
        enum: [asc, desc]
  headers:
    X-Request-Id:
      description: ID do server tạo cho mỗi request.
      schema:
        type: string
    Retry-After:
      description: Số giây chờ trước khi gửi lại sau HTTP 429.
      schema:
        type: integer
        minimum: 0
  responses:
    ValidationError:
      description: 400 VALIDATION_ERROR; field sai nằm trong error.details.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 401 AUTH_UNAUTHORIZED hoặc AUTH_TOKEN_EXPIRED.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 403 INSUFFICIENT_PERMISSIONS; gồm Manager xem nhân viên ngoài phòng ban.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 404 RESOURCE_NOT_FOUND; không tiết lộ tài nguyên khác ngoài phạm vi.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 409 RESOURCE_CONFLICT.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: 429 RATE_LIMIT_EXCEEDED; API thường 120/phút/IP, login 5/15 phút/email+IP, refresh 30/phút/IP hoặc tài khoản tạm khóa 15 phút sau 5 lần đăng nhập sai.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: 500 INTERNAL_ERROR; không lộ chi tiết nội bộ.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
